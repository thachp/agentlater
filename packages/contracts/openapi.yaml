openapi: 3.1.0
info:
  title: RunLater internal API
  version: 0.2.0
  description: >
    Contract between apps/gateway (TypeScript) and apps/api (Rust). Not public: the API
    is reached only over a service binding. Every route except /health requires a
    RunLater-Assertion header signed by the gateway; the project comes from the
    assertion, never from the path or body. See docs/spec/ARCHITECTURE.md.
servers:
  - url: https://api.internal
security:
  - assertion: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service: { type: string }
                  status: { const: ok }
  /v1/projects:
    post:
      operationId: createProject
      description: >
        Creates the project with a fresh trial. Idempotent: a repeat returns the existing
        project unchanged (200) and never refills the trial or rotates the secret.
        Scope: project.
      responses:
        "201": { $ref: "#/components/responses/Project" }
        "200": { $ref: "#/components/responses/Project" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/self:
    get:
      operationId: getProject
      description: "Scope: read."
      responses:
        "200": { $ref: "#/components/responses/Project" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/self/credits:
    post:
      operationId: addCredit
      description: >
        Adds attempts bought with one payment. The balance, including attempts left from the
        trial or an earlier purchase unless they have expired, becomes valid for 365 days from
        now, and crons stopped by expiry start again. 201 when the payment is new; 200 when
        payment_id was already applied, which changes nothing. Called by the gateway's Stripe
        webhook only. Scope: billing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payment_id, attempts]
              properties:
                payment_id: { type: string, pattern: "^[A-Za-z0-9_]{1,255}$", description: The Stripe Checkout Session id. }
                attempts: { type: integer, minimum: 1, maximum: 10000000 }
      responses:
        "201": { $ref: "#/components/responses/Project" }
        "200": { $ref: "#/components/responses/Project" }
        default: { $ref: "#/components/responses/Error" }
  /v1/tasks:
    post:
      operationId: scheduleTask
      description: >
        Schedules an HTTP request. 201 when created; 200 when idempotency_key replays an
        identical earlier request. Scope: schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleRequest" }
      responses:
        "201": { $ref: "#/components/responses/Task" }
        "200": { $ref: "#/components/responses/Task" }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: listTasks
      description: "Newest first. Scope: read."
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: lane, in: query, schema: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,64}$" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: A page of tasks, without attempt history.
          content:
            application/json:
              schema:
                type: object
                required: [tasks, next_cursor]
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }
  /v1/tasks/{id}:
    get:
      operationId: getTask
      description: "Includes attempt history. Scope: read."
      parameters: [{ $ref: "#/components/parameters/TaskId" }]
      responses:
        "200": { $ref: "#/components/responses/Task" }
        default: { $ref: "#/components/responses/Error" }
  /v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      description: >
        Cancels a waiting task. If an attempt is in flight the task becomes canceled when
        it ends, unless it succeeds. 409 task_finished if already succeeded or failed.
        Scope: cancel.
      parameters: [{ $ref: "#/components/parameters/TaskId" }]
      responses:
        "200": { $ref: "#/components/responses/Task" }
        default: { $ref: "#/components/responses/Error" }
  /v1/tasks/{id}/redrive:
    post:
      operationId: redriveTask
      description: >
        Gives a failed task a fresh set of attempts, starting now. 409 task_not_failed
        otherwise. Scope: schedule.
      parameters: [{ $ref: "#/components/parameters/TaskId" }]
      responses:
        "200": { $ref: "#/components/responses/Task" }
        default: { $ref: "#/components/responses/Error" }
  /v1/watches:
    post:
      operationId: watch
      description: >
        Starts a watch: a task whose attempts poll `url` (now, then every `every`) until the
        response matches `until`, the deadline passes, or three polls in a row fail. Each poll
        costs one delivery attempt. With on_match, a match also queues that request as an
        ordinary task (its attempt, and its callback's, reserved now). 201 created, 200 for an
        idempotent replay. Scope: schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchRequest" }
      responses:
        "201": { $ref: "#/components/responses/Task" }
        "200": { $ref: "#/components/responses/Task" }
        default: { $ref: "#/components/responses/Error" }
  /v1/crons:
    post:
      operationId: putCron
      description: >
        Creates a cron (201) or replaces the definition of the one with this name (200), keeping
        its health and history. 429 cron_limit past 10 crons. Scope: schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CronRequest" }
      responses:
        "201": { $ref: "#/components/responses/Cron" }
        "200": { $ref: "#/components/responses/Cron" }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: listCrons
      description: "By name. Scope: read."
      responses:
        "200":
          description: All of the project's crons.
          content:
            application/json:
              schema:
                type: object
                required: [crons]
                properties:
                  crons: { type: array, items: { $ref: "#/components/schemas/Cron" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/crons/{name}:
    get:
      operationId: getCron
      description: "404 cron_not_found. Scope: read."
      parameters: [{ $ref: "#/components/parameters/CronName" }]
      responses:
        "200": { $ref: "#/components/responses/Cron" }
        default: { $ref: "#/components/responses/Error" }
  /v1/crons/{name}/delete:
    post:
      operationId: deleteCron
      description: "Removes the cron and returns it as it was. Runs already started finish. Scope: cancel."
      parameters: [{ $ref: "#/components/parameters/CronName" }]
      responses:
        "200": { $ref: "#/components/responses/Cron" }
        default: { $ref: "#/components/responses/Error" }
  /v1/inbox/read:
    post:
      operationId: readInbox
      description: >
        Events after `after` (default: the acked cursor), oldest first. Reading does not move
        the cursor unless `ack` is true, which acks up to the last event returned. `dropped`
        is reported as it was before that ack. With ack, an after past the cursor is a 400,
        since acking would skip unread events. Scope: read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                after: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
                ack: { type: boolean, default: false }
      responses:
        "200":
          description: A page of inbox events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxPage" }
        default: { $ref: "#/components/responses/Error" }
  /v1/inbox/ack:
    post:
      operationId: ackInbox
      description: >
        Moves the cursor forward to up_to; an older up_to changes nothing. 400 ack_beyond_inbox
        when up_to is past the newest event. Scope: read (acking is part of reading).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [up_to]
              properties:
                up_to: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The cursor after the ack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxCursor" }
        default: { $ref: "#/components/responses/Error" }
  /v1/wake:
    post:
      operationId: setWake
      description: >
        Sets where wakes go, replacing any earlier setting and turning a disabled wake back on.
        A wake not yet sent is canceled; if the inbox has unread events, a new one is queued.
        Scope: schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WakeRequest" }
      responses:
        "200":
          description: The wake.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wake" }
        default: { $ref: "#/components/responses/Error" }
  /v1/wake/delete:
    post:
      operationId: deleteWake
      description: >
        Stops wakes and returns the wake as it was. One being sent finishes; one not yet sent is
        canceled. 404 wake_not_set. Scope: cancel.
      responses:
        "200":
          description: The wake as it was.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wake" }
        default: { $ref: "#/components/responses/Error" }
  /v1/secrets:
    post:
      operationId: setSecret
      description: >
        Seals and stores a secret, or replaces the one with this name (201 created, 200 replaced).
        The value is never returned by any route. 429 secret_limit past 50; 503
        secrets_unavailable when the API has no SECRETS_KEY. Scope: secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretRequest" }
      responses:
        "201": { $ref: "#/components/responses/Secret" }
        "200": { $ref: "#/components/responses/Secret" }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: listSecrets
      description: "Names and hosts, by name; never values. Scope: read."
      responses:
        "200":
          description: The project's secrets.
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets: { type: array, items: { $ref: "#/components/schemas/Secret" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/secrets/{name}/delete:
    post:
      operationId: deleteSecret
      description: "Returns the secret as it was. 404 secret_not_found. Scope: secrets."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" } }
      responses:
        "200": { $ref: "#/components/responses/Secret" }
        default: { $ref: "#/components/responses/Error" }
  /v1/hooks:
    post:
      operationId: createHook
      description: >
        Creates an inbound hook, or replaces the one with this name with a new token (201 created,
        200 replaced; the old URL stops working). Returns url_path, /h/{project_id}/{token}, this
        once: only its SHA-256 is stored. The gateway turns it into the public URL. 403
        trial_expired, 429 hook_limit past 20, 503 secrets_unavailable for verify without a
        SECRETS_KEY. Scope: schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HookRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedHook" }
        "200": { $ref: "#/components/responses/CreatedHook" }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: listHooks
      description: "Hooks by name, with their counts; never URLs or secrets. Scope: read."
      responses:
        "200":
          description: The project's hooks.
          content:
            application/json:
              schema:
                type: object
                required: [hooks]
                properties:
                  hooks: { type: array, items: { $ref: "#/components/schemas/Hook" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/hooks/_receive:
    post:
      operationId: receiveHook
      description: >
        A request a sender made to a hook, forwarded by the gateway's public /h/ route. Checks the
        signature, the rate limits (per hook, and per project per UTC day) and the sender's
        delivery id, then writes a hook.received inbox event. Answers with a status and an empty
        body: 202 written, 200 a retry already written, 401 signature_missing / signature_invalid
        / signature_stale, 404 hook_not_found, 410 project_expired, 413 too_large, 429
        rate_limited / daily_limit (with Retry-After), 503 secrets_unavailable. Scope:
        hooks.receive, which only the gateway uses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, headers, body]
              properties:
                token: { type: string, pattern: "^hk_[0-9a-f]{64}$" }
                headers: { type: array, items: { type: array, minItems: 2, maxItems: 2, items: { type: string } } }
                body: { type: string, description: "The raw body, base64; at most 256 KiB decoded." }
      responses:
        "202": { description: Written to the inbox. }
        "200": { description: A retry of a delivery already written. }
        default: { description: "Refused; see the description for the statuses." }
  /v1/hooks/{name}/delete:
    post:
      operationId: deleteHook
      description: "Returns the hook as it was; its URL answers 404 from now on. 404 hook_not_found. Scope: cancel."
      parameters:
        - { $ref: "#/components/parameters/CronName" }
      responses:
        "200": { $ref: "#/components/responses/Hook" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    assertion:
      type: apiKey
      in: header
      name: RunLater-Assertion
      description: >
        base64url(claims JSON) "." base64url(Ed25519 signature over the first segment).
        Claims: aud "runlater-api", sub (project id, [A-Za-z0-9_-]{1,64}), scope
        (space-separated: project schedule read cancel billing secrets hooks.receive), iat and exp in unix seconds,
        lifetime at most 300 s.
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^task_[0-9a-f]{20}$" }
    CronName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}$" }
  responses:
    Hook:
      description: The hook, without its URL or secret.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Hook" }
    CreatedHook:
      description: The hook, and its URL's path, shown this once.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Hook" }
              - type: object
                required: [url_path]
                properties:
                  url_path: { type: string, pattern: "^/h/prj_[0-9a-f]{24}/hk_[0-9a-f]{64}$" }
    Secret:
      description: The secret, without its value.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Secret" }
    Project:
      description: The project and its attempts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Project" }
    Task:
      description: The task.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Task" }
    Cron:
      description: The cron.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Cron" }
    Error:
      description: >
        400 invalid_request / ack_beyond_inbox / secret_not_found / secret_host_not_allowed, 401 unauthorized, 402 budget_exhausted, 403 forbidden or
        trial_expired, 404 not_found / project_not_found / task_not_found / cron_not_found / wake_not_set,
        409 idempotency_conflict / task_finished / task_not_failed / watch_not_redrivable / wake_not_redrivable,
        429 task_limit (1,000 tasks held, finished ones included until purged) / cron_limit,
        500 internal_error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  field: { type: string, description: Request field at fault, when known. }
  schemas:
    WatchRequest:
      type: object
      additionalProperties: false
      required: [url, every, until, deadline]
      properties:
        url: { type: string, maxLength: 2048 }
        method: { $ref: "#/components/schemas/Method", default: GET }
        headers: { type: object, maxProperties: 32, additionalProperties: { type: string } }
        body: { type: string, maxLength: 65536 }
        every: { type: string, pattern: "^[0-9]{1,7}[smhd]$", description: "Between polls: 5m to 24h." }
        until: { $ref: "#/components/schemas/Until" }
        deadline: { type: string, pattern: "^[0-9]{1,7}[smhd]$", description: "At least one interval, at most 7d, and before the trial ends." }
        callback_url: { type: string, maxLength: 2048, description: 'https:// URL, or "inbox".' }
        idempotency_key: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
        on_match: { $ref: "#/components/schemas/OnMatch" }
    OnMatch:
      type: object
      additionalProperties: false
      required: [url]
      description: >
        Sent once, as an ordinary task (triggered_by the watch), when until matches; never on
        a timeout, failure or cancel. Same rules as ScheduleRequest, without timing, lanes or
        idempotency keys. A secret it refers to must allow its own host.
      properties:
        url: { type: string, maxLength: 2048 }
        method: { $ref: "#/components/schemas/Method", default: POST }
        headers: { type: object, maxProperties: 32, additionalProperties: { type: string } }
        body: { type: string, maxLength: 65536 }
        max_attempts: { type: integer, minimum: 1, maximum: 5, default: 5 }
        callback_url: { type: string, maxLength: 2048, description: 'https:// URL, or "inbox".' }
        capture: { type: boolean, default: false }
    OnMatchView:
      type: object
      required: [method, url, header_names, callback_url, capture]
      properties:
        method: { $ref: "#/components/schemas/Method" }
        url: { type: string }
        header_names: { type: array, items: { type: string } }
        callback_url: { type: [string, "null"] }
        capture: { type: boolean }
    Until:
      type: object
      additionalProperties: false
      description: >
        path + in: a 2xx response whose JSON body (first 64 KiB) has one of these values at
        this JSON Pointer. status: the response status is one of these. Given both, both hold.
      properties:
        path: { type: string, maxLength: 256 }
        in: { type: array, minItems: 1, maxItems: 20, items: { type: [string, number, boolean, "null"] } }
        status: { type: array, minItems: 1, maxItems: 20, items: { type: integer, minimum: 100, maximum: 599 } }
    Watch:
      type: object
      required: [every_ms, deadline_ms, until, consecutive_errors, reason, matched, last_status, last_body, on_match, action_task_id, action_skipped]
      properties:
        every_ms: { type: integer }
        deadline_ms: { type: integer }
        until: { $ref: "#/components/schemas/Until" }
        consecutive_errors: { type: integer, description: "Polls in a row that failed; three end the watch." }
        reason:
          type: [string, "null"]
          description: >
            Why it ended: matched, timed_out, poll_failing, poll_rejected, response_too_large or
            budget_exhausted.
            Null while polling, or if canceled.
        matched: { description: The value that satisfied until (the status code for a status-only condition). }
        last_status: { type: [integer, "null"] }
        last_body: { type: [string, "null"], description: "Up to 16 KiB of the last poll's response body. Null in lists." }
        on_match:
          oneOf: [{ $ref: "#/components/schemas/OnMatchView" }, { type: "null" }]
          description: The request sent on a match; header values and body are not shown.
        action_task_id: { type: [string, "null"], description: "The task on_match queued, once the watch matched." }
        action_skipped: { type: [string, "null"], description: 'Why a match sent no action: "canceled" (cancel was asked for during the matching poll).' }
    CronRequest:
      type: object
      additionalProperties: false
      required: [name, schedule, url]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}$" }
        schedule: { type: string, maxLength: 128, description: "5-field cron in UTC; one minute value, so it runs at most once an hour." }
        url: { type: string, maxLength: 2048 }
        method: { $ref: "#/components/schemas/Method", default: POST }
        headers: { type: object, maxProperties: 32, additionalProperties: { type: string } }
        body: { type: string, maxLength: 65536 }
        max_attempts: { type: integer, minimum: 1, maximum: 5, default: 5 }
        alert_url:
          type: string
          maxLength: 2048
          description: >
            Gets a signed POST {"event": "cron.failing" | "cron.recovered", "reason", "task_id", "cron": <Cron>}
            when the cron starts failing and when it recovers. "inbox" adds that payload to the inbox instead.
        callback_url: { type: string, maxLength: 2048, description: 'Where each run reports, as ScheduleRequest.callback_url: https:// URL, or "inbox".' }
        capture: { type: boolean, default: false, description: "Each run keeps its response, as ScheduleRequest.capture." }
        report: { type: string, enum: [always, failures], default: always, description: 'Which runs report to callback_url; "failures" needs callback_url.' }
    Cron:
      type: object
      description: Header values and the body are never returned.
      required: [name, schedule, method, url, header_names, body_bytes, max_attempts, alert_url, callback_url, report, capture, next_run_ms, health, health_reason, last_run_task_id, last_run_ms, last_success_ms, failing_since_ms, created_ms, updated_ms]
      properties:
        name: { type: string }
        schedule: { type: string }
        method: { $ref: "#/components/schemas/Method" }
        url: { type: string }
        header_names: { type: array, items: { type: string } }
        body_bytes: { type: integer }
        max_attempts: { type: integer }
        alert_url: { type: [string, "null"] }
        callback_url: { type: [string, "null"] }
        report: { type: string, enum: [always, failures] }
        capture: { type: boolean }
        next_run_ms: { type: [integer, "null"], description: Null once the cron has stopped because the trial ended. }
        health: { type: string, enum: [pending, healthy, failing] }
        health_reason:
          type: [string, "null"]
          description: run_failed, budget_exhausted, task_limit or trial_expired.
        last_run_task_id: { type: [string, "null"] }
        last_run_ms: { type: [integer, "null"] }
        last_success_ms: { type: [integer, "null"] }
        failing_since_ms: { type: [integer, "null"] }
        created_ms: { type: integer }
        updated_ms: { type: integer }
    Status:
      type: string
      enum: [scheduled, delivering, retrying, succeeded, failed, canceled]
    Method:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE]
    Project:
      type: object
      required: [id, created_ms, expires_ms, attempt_budget, attempts_used, attempts_remaining, paid, signing_secret, inbox_unread, wake]
      properties:
        id: { type: string }
        created_ms: { type: integer }
        expires_ms: { type: integer }
        attempt_budget: { type: integer }
        attempts_used: { type: integer }
        attempts_remaining: { type: integer }
        paid: { type: boolean, description: Whether attempts have ever been bought for this project. }
        signing_secret: { type: string, description: Verifies RunLater-Signature on deliveries. }
        inbox_unread: { type: integer, description: Inbox events after the acked cursor. }
        wake:
          oneOf: [{ $ref: "#/components/schemas/Wake" }, { type: "null" }]
          description: Set by setWake.
    ScheduleRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: "https:// to a public DNS name." }
        method: { $ref: "#/components/schemas/Method", default: POST }
        headers:
          type: object
          maxProperties: 32
          additionalProperties: { type: string }
        body: { type: string, maxLength: 65536, description: Not allowed with GET. }
        run_at_ms: { type: integer, minimum: 0, description: "Unix ms; absent or past means now. At most 7 days ahead. Not with delay." }
        delay: { type: string, pattern: "^[0-9]{1,7}[smhd]$", description: "Relative alternative to run_at_ms, e.g. 90s, 15m, 24h, 7d. At most 7 days." }
        callback_url:
          type: string
          maxLength: 2048
          description: >
            https:// to a public DNS name. When the task succeeds, fails or is canceled, a callback task POSTs
            {"event": "task.finished", "task": <Task with attempts>} here, signed like any delivery. Or "inbox":
            the same payload becomes an inbox event, in the same transaction, using no attempt or task slot.
        capture:
          type: boolean
          default: false
          description: Keep the destination's last response as the task's `response`.
        idempotency_key: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
        max_attempts: { type: integer, minimum: 1, maximum: 5, default: 5 }
        lane:
          type: string
          pattern: "^[A-Za-z0-9_.:-]{1,64}$"
          description: >
            Tasks in the same lane run one at a time. A started task (delivering or retrying) holds the lane until it
            finishes; then the waiting task with the earliest due time, then earliest scheduled, goes next.
    Attempt:
      type: object
      required: [number, started_ms, finished_ms, outcome, http_status]
      properties:
        number: { type: integer }
        started_ms: { type: integer }
        finished_ms: { type: [integer, "null"] }
        outcome:
          type: [string, "null"]
          description: http_<status>, timeout, network_error, rejected or lease_expired.
        http_status: { type: [integer, "null"] }
    Task:
      type: object
      required: [id, status, method, url, header_names, body_bytes, run_at_ms, next_attempt_ms, max_attempts, attempt_count, idempotency_key, callback_url, callback_task_id, callback_for, inbox_seq, capture, response, wake_call, failure, report_failures_only, lane, cron, alert_for, watch, triggered_by, created_ms, updated_ms, finished_ms]
      description: Header values and the body are never returned; they may hold credentials.
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        method: { $ref: "#/components/schemas/Method" }
        url: { type: string }
        header_names: { type: array, items: { type: string } }
        body_bytes: { type: integer }
        run_at_ms: { type: integer }
        next_attempt_ms: { type: [integer, "null"] }
        max_attempts: { type: integer }
        attempt_count: { type: integer }
        idempotency_key: { type: [string, "null"] }
        callback_url: { type: [string, "null"] }
        callback_task_id: { type: [string, "null"], description: The callback task for the most recent time this task finished. }
        callback_for: { type: [string, "null"], description: "Set on callback tasks: the task being reported on." }
        inbox_seq: { type: [integer, "null"], description: 'With callback_url "inbox": the event for the most recent time it finished.' }
        capture: { type: boolean }
        wake_call: { type: boolean, description: Set on wakes. }
        failure: { type: [string, "null"], description: "Why it failed without an attempt: secret_missing, secret_host_not_allowed, secret_too_large or secret_unavailable." }
        report_failures_only: { type: boolean, description: "Set on runs of a cron with report: failures; a run that did not fail has no report, by design." }
        response:
          oneOf: [{ $ref: "#/components/schemas/CapturedResponse" }, { type: "null" }]
          description: With capture, the last response; null until one arrives and once deleted, 7 days after the task finishes.
        lane: { type: [string, "null"] }
        cron: { type: [string, "null"], description: Set on a cron's runs. }
        alert_for: { type: [string, "null"], description: Set on cron alerts. }
        watch:
          oneOf: [{ $ref: "#/components/schemas/Watch" }, { type: "null" }]
          description: Set on watches.
        triggered_by: { type: [string, "null"], description: "Set on a watch's on_match action: the watch that sent it." }
        created_ms: { type: integer }
        updated_ms: { type: integer }
        finished_ms: { type: [integer, "null"] }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/Attempt" }
          description: Present on getTask and on mutations; omitted in lists.
    CapturedResponse:
      type: object
      description: From the destination, so untrusted.
      required: [attempt, status, headers, body, body_bytes, truncated]
      properties:
        attempt: { type: integer, description: The attempt that got this response. }
        status: { type: integer }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Only content-type, location, etag and retry-after, lowercased.
        body: { type: [string, "null"], description: "First 16 KiB as UTF-8, invalid bytes replaced. Null in lists, when it could not be read in time (truncated is then true), and in inbox events after 7 days." }
        body_bytes: { type: [integer, "null"], description: Content-Length, when sent for an unencoded body. }
        truncated: { type: boolean }
    InboxPage:
      type: object
      required: [events, acked_seq, unread, dropped]
      properties:
        events:
          type: array
          items:
            type: object
            required: [seq, at_ms, event]
            description: >
              The payload a callback or alert would POST, plus seq and at_ms: task.finished
              {task}, or cron.failing / cron.recovered {reason, task_id, cron}.
            properties:
              seq: { type: integer }
              at_ms: { type: integer }
              event: { type: string, enum: [task.finished, cron.failing, cron.recovered, wake.disabled] }
        acked_seq: { type: integer }
        unread: { type: integer }
        dropped: { type: integer, description: Unread events removed (by age or a full inbox) since the cursor last moved. }
    InboxCursor:
      type: object
      required: [acked_seq, unread]
      properties:
        acked_seq: { type: integer }
        unread: { type: integer }
    WakeRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: "https:// to a public DNS name: what starts an agent run." }
        headers: { type: object, maxProperties: 32, additionalProperties: { type: string } }
        debounce: { type: string, pattern: "^[0-9]{1,7}[smhd]$", default: 15m, description: "At most one wake per this long: 1m to 24h." }
    Wake:
      type: object
      description: >
        Header values are never returned. Each wake is a signed POST of
        {"event": "inbox.unread", "project_id", "unread"}, a task with wake_call true.
      required: [url, header_names, debounce_ms, state, disabled_reason, consecutive_failures, last_wake_ms, last_wake_task_id, created_ms, updated_ms]
      properties:
        url: { type: string }
        header_names: { type: array, items: { type: string } }
        debounce_ms: { type: integer }
        state: { type: string, enum: [active, disabled] }
        disabled_reason: { type: [string, "null"], description: wake_failing after 3 failed wakes in a row. }
        consecutive_failures: { type: integer }
        last_wake_ms: { type: [integer, "null"], description: When the last wake was sent; the next goes no sooner than debounce_ms after it. }
        last_wake_task_id: { type: [string, "null"] }
        created_ms: { type: integer }
        updated_ms: { type: integer }
    SecretRequest:
      type: object
      additionalProperties: false
      required: [name, value, allowed_hosts]
      properties:
        name: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        value: { type: string, minLength: 16, maxLength: 4096, description: Printable ASCII, no line breaks. Sealed before it is stored. }
        allowed_hosts:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string }
          description: Exact public host names; no wildcards.
    HookRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}$" }
        verify:
          type: object
          additionalProperties: false
          required: [scheme, secret]
          properties:
            scheme: { type: string, enum: [github, stripe, hmac_sha256] }
            secret: { type: string, minLength: 16, maxLength: 1024, description: Printable ASCII; sealed and never returned. }
            header: { type: string, maxLength: 64, description: hmac_sha256 only (required there). }
            prefix: { type: string, maxLength: 32, description: hmac_sha256 only. }
        keep_headers:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 64 }
          description: Never authorization, cookie, proxy-authorization, set-cookie or a signature header.
    Hook:
      type: object
      required: [name, verify, keep_headers, created_ms, last_received_ms, received, refused]
      properties:
        name: { type: string }
        verify:
          type: [object, "null"]
          properties:
            scheme: { type: string, enum: [github, stripe, hmac_sha256] }
            header: { type: string }
            prefix: { type: string }
        keep_headers: { type: array, items: { type: string } }
        created_ms: { type: integer }
        last_received_ms: { type: [integer, "null"] }
        received: { type: integer, description: Requests written to the inbox. }
        refused:
          type: object
          additionalProperties: { type: integer }
          description: "Refusals by reason: signature_missing, signature_invalid, signature_stale, rate_limited, daily_limit, project_expired."
    Secret:
      type: object
      description: Never includes the value.
      required: [name, allowed_hosts, created_ms, updated_ms]
      properties:
        name: { type: string }
        allowed_hosts: { type: array, items: { type: string } }
        created_ms: { type: integer }
        updated_ms: { type: integer }
