[workspace]
resolver = "2"
members = ["crates/core", "crates/egress", "apps/api"]

[workspace.package]
edition = "2021"
rust-version = "1.92"
publish = false
license = "MIT"

[workspace.dependencies]
runlater-core = { path = "crates/core" }
runlater-egress = { path = "crates/egress" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "=0.8.7", features = ["queue"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
url = "2"
base64 = "0.23"
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }

[profile.release]
lto = true
opt-level = "s"
