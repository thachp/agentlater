[workspace]
resolver = "2"
members = ["crates/core", "crates/egress", "apps/api"]

[workspace.package]
edition = "2021"
rust-version = "1.92"
publish = false
license = "MIT"

[workspace.dependencies]
runlater-core = { path = "crates/core" }
runlater-egress = { path = "crates/egress" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "=0.8.7", features = ["queue"] }
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
url = "2"
base64 = "0.23"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.13"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }

# Leanness guardrails; see CODING_STANDARDS.md. CI runs clippy with `-D warnings`, so each is an error there.
[workspace.lints.rust]
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.clippy]
too_many_lines = "warn"
redundant_clone = "warn"

[profile.release]
lto = true
opt-level = "s"
