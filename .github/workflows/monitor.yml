name: Monitor
# Probes production. A failed scheduled run opens a "Monitor is failing" issue, which notifies the
# repository's watchers; the next run that passes closes it. Each scheduled run also re-enables this
# workflow, so GitHub's 60-day pause for inactive repositories never stops it.
on:
  schedule:
    - cron: '*/15 * * * *' # health
    - cron: '17 9 * * *'   # daily journey
  workflow_dispatch:
    inputs:
      journey:
        description: Also run the agent journey
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: monitor
  cancel-in-progress: false
env:
  SITE_URL: https://agentlater.io
  GATEWAY_URL: https://gateway.agentlater.io
  # Hook URLs and connected clients keep these addresses, so they have to keep answering.
  OLD_SITE_URL: https://runlater.io
  OLD_GATEWAY_URL: https://gateway.runlater.io
  OLD_HOOKS_URL: https://hooks.runlater.io
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The gateway health check also reaches the API through its binding.
      - name: Gateway and API
        run: curl --fail --silent --show-error --max-time 10 --retry 3 --retry-all-errors "$GATEWAY_URL/health"
      - name: Old gateway and hooks hosts
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 3 --retry-all-errors "$OLD_GATEWAY_URL/health"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 --retry 3 --retry-all-errors "$OLD_HOOKS_URL/health")
          test "$status" = 404 || { echo "old hooks host answered $status, expected 404"; exit 1; }
      - name: Old site redirects
        run: |
          location=$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' --max-time 10 --retry 3 --retry-all-errors "$OLD_SITE_URL/pay?check=1")
          test "$location" = "308 $SITE_URL/pay?check=1" || { echo "old site answered: $location"; exit 1; }
      - name: Site
        run: |
          for path in / /docs /docs/capabilities /docs/delivery /pay /terms /privacy; do
            curl --fail --silent --show-error --output /dev/null --max-time 10 --retry 3 --retry-all-errors "$SITE_URL$path"
          done

  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fails if a deploy drops the Stripe settings: without them the paid endpoint leaves
      # /openapi.json and the webhook answers 404 rather than rejecting the missing signature.
      # Spends nothing: no payment link is made and no charge is started.
      - name: Billing
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 3 --retry-all-errors "$GATEWAY_URL/openapi.json" \
            | jq --exit-status '.paths["/billing/mpp/{link}"].post["x-payment-info"]' > /dev/null
          curl --fail --silent --show-error --output /dev/null --max-time 10 --retry 3 --retry-all-errors "$GATEWAY_URL/llms.txt"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 --retry 3 --retry-all-errors \
            --request POST --data '{}' "$GATEWAY_URL/billing/webhook")
          test "$status" = 400 || { echo "unsigned webhook answered $status, expected 400"; exit 1; }

  # A real agent registers with production, creates a project and schedules deliveries. The
  # receiver is the staging fixture (a public workers.dev URL); its token lives in the staging
  # environment, so this job runs there. Each run leaves behind one agent, two trial projects
  # (Agent Auth and hosted MCP) and one OAuth client and grant.
  journey:
    needs: health
    if: github.event.schedule == '17 9 * * *' || (github.event_name == 'workflow_dispatch' && inputs.journey)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production journey
        env:
          RECEIVER_URL: ${{ vars.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: node apps/gateway/e2e/staging.mjs

  # The alert. Runs after every scheduled run, passing or not. Manual runs are left out: they are
  # for trying things, and a failure there is seen by whoever started it.
  report:
    needs: [health, billing, journey]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Without this, GitHub pauses scheduled workflows after 60 days with no repository activity.
      - name: Keep the schedule alive
        run: gh api --method PUT "repos/$GH_REPO/actions/workflows/monitor.yml/enable"
      # One open issue per failing check: opened by its first failed run, closed by the next run of
      # that same check that passes. Runs in between say nothing, so an outage is one notification.
      # A check that was skipped (the journey, on the 15-minute runs) leaves its issue alone.
      - name: Open or close alert issues
        run: |
          gh label create monitor --color B60205 --description "Production monitor alerts" 2>/dev/null || true
          for check in health billing journey; do
            result=$(jq --raw-output --arg c "$check" '.[$c].result' <<<"$NEEDS")
            title="Monitor: $check is failing"
            open=$(gh issue list --label monitor --state open --json number,title \
              | jq --raw-output --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')
            case "$result" in
              failure|cancelled)
                [ -n "$open" ] || gh issue create --label monitor --title "$title" \
                  --body "The scheduled $check check against production failed: $RUN_URL. This issue closes itself when that check passes again." ;;
              success)
                [ -z "$open" ] || gh issue close "$open" --comment "Passing again: $RUN_URL" ;;
            esac
          done
