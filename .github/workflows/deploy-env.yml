name: Deploy environment
# Deploys every Worker to one wrangler environment. Order matters: the gateway's
# service binding needs the API Worker to exist first.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: cargo install worker-build --version 0.8.7 --locked
      - run: npm ci

      # Secrets come from the GitHub environment (scripts/setup-deploy-secrets.mjs) and reach
      # Cloudflare only at deploy time, through a temp file removed straight after.
      - name: Deploy api
        env:
          GATEWAY_PUBLIC_KEY: ${{ vars.GATEWAY_PUBLIC_KEY }}
          # The key has two slots so it can be rotated without reading it back
          # (scripts/rotate-secrets-key.mjs): SECRETS_KEY_SLOT picks the current one, and while
          # SECRETS_KEY_ROTATING is true the other is the API's SECRETS_KEY_PREVIOUS.
          SLOT_1: ${{ secrets.SECRETS_KEY }}
          SLOT_2: ${{ secrets.SECRETS_KEY_2 }}
          ROTATING: ${{ vars.SECRETS_KEY_ROTATING == 'true' }}
          CURRENT_SLOT: ${{ vars.SECRETS_KEY_SLOT == '2' && '2' || '1' }}
        run: |
          if [ "$CURRENT_SLOT" = 2 ]; then SECRETS_KEY=$SLOT_2 SECRETS_KEY_PREVIOUS=$SLOT_1; else SECRETS_KEY=$SLOT_1 SECRETS_KEY_PREVIOUS=$SLOT_2; fi
          if [ "$ROTATING" != true ]; then SECRETS_KEY_PREVIOUS=; fi
          if [ "$ROTATING" = true ] && { [ -z "$SECRETS_KEY" ] || [ -z "$SECRETS_KEY_PREVIOUS" ]; }; then
            echo "::error::SECRETS_KEY_ROTATING is true but a key slot is empty; see docs/DEPLOY.md, Rotating SECRETS_KEY"; exit 1
          fi
          export SECRETS_KEY SECRETS_KEY_PREVIOUS
          test -n "$GATEWAY_PUBLIC_KEY" || { echo "::error::GATEWAY_PUBLIC_KEY is not set; run scripts/setup-deploy-secrets.mjs"; exit 1; }
          # Without SECRETS_KEY the API runs, but set_secret answers 503 secrets_unavailable.
          if [ -z "$SECRETS_KEY" ]; then
            echo "::warning::SECRETS_KEY is not set, so project secrets are unavailable; run scripts/setup-deploy-secrets.mjs"
            npx wrangler deploy --env "$DEPLOY_ENV" --var "GATEWAY_PUBLIC_KEY:$GATEWAY_PUBLIC_KEY"
          else
            secrets="$(mktemp "$RUNNER_TEMP/secrets.XXXXXX")"
            trap 'rm -f "$secrets"' EXIT
            node -e 'const { SECRETS_KEY, SECRETS_KEY_PREVIOUS } = process.env;
              process.stdout.write(JSON.stringify(SECRETS_KEY_PREVIOUS ? { SECRETS_KEY, SECRETS_KEY_PREVIOUS } : { SECRETS_KEY }))' > "$secrets"
            npx wrangler deploy --env "$DEPLOY_ENV" --var "GATEWAY_PUBLIC_KEY:$GATEWAY_PUBLIC_KEY" \
              --var "SECRETS_KEY_SLOT:$CURRENT_SLOT" --secrets-file "$secrets"
            # --secrets-file never deletes, so the previous key of a finished rotation is deleted
            # here. A failed lookup fails the deploy: a leaked key must not quietly stay.
            if [ -z "$SECRETS_KEY_PREVIOUS" ]; then
              names="$(npx wrangler secret list --env "$DEPLOY_ENV" --format json)"
              if jq --exit-status 'any(.[]; .name == "SECRETS_KEY_PREVIOUS")' <<<"$names" > /dev/null; then
                npx wrangler secret delete SECRETS_KEY_PREVIOUS --env "$DEPLOY_ENV"
              fi
            fi
          fi
        working-directory: apps/api

      # Forward-only; must apply before the gateway that reads the new schema deploys.
      - name: Apply gateway D1 migrations
        run: npx wrangler d1 migrations apply DB --env "$DEPLOY_ENV" --remote
        working-directory: apps/gateway

      - name: Deploy gateway
        env:
          ASSERTION_PRIVATE_KEY: ${{ secrets.ASSERTION_PRIVATE_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          # Billing (docs/DEPLOY.md, "Billing"): optional; Checkout needs the first three, MPP the
          # secret key, webhook secret and profile id.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PROFILE_ID: ${{ vars.STRIPE_PROFILE_ID }}
        run: |
          test -n "$ASSERTION_PRIVATE_KEY" && test -n "$BETTER_AUTH_SECRET" || { echo "::error::gateway secrets are not set; run scripts/setup-deploy-secrets.mjs"; exit 1; }
          secrets="$(mktemp "$RUNNER_TEMP/secrets.XXXXXX")"
          trap 'rm -f "$secrets"' EXIT
          node -e '
            const e = process.env;
            const out = { ASSERTION_PRIVATE_KEY: e.ASSERTION_PRIVATE_KEY, BETTER_AUTH_SECRET: e.BETTER_AUTH_SECRET };
            for (const k of ["STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET", "STRIPE_PUBLISHABLE_KEY", "STRIPE_PROFILE_ID"]) if (e[k]) out[k] = e[k];
            process.stdout.write(JSON.stringify(out));
          ' > "$secrets"
          npx wrangler deploy --env "$DEPLOY_ENV" --secrets-file "$secrets"
        working-directory: apps/gateway

      - name: Deploy web
        run: npm run deploy -w @runlater/web -- --env "$DEPLOY_ENV"

      # Test fixture the staging journey delivers to. Never deployed to production.
      - name: Deploy staging receiver
        if: inputs.environment == 'staging'
        env:
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: |
          test -n "$RECEIVER_TOKEN" || { echo "::error::RECEIVER_TOKEN is not set; run scripts/setup-deploy-secrets.mjs"; exit 1; }
          secrets="$(mktemp "$RUNNER_TEMP/secrets.XXXXXX")"
          trap 'rm -f "$secrets"' EXIT
          node -e 'process.stdout.write(JSON.stringify({RECEIVER_TOKEN:process.env.RECEIVER_TOKEN}))' > "$secrets"
          npx wrangler deploy --env staging --secrets-file "$secrets"
        working-directory: apps/receiver

      # The gateway health check also reaches the API through its binding.
      - name: Smoke check
        if: vars.GATEWAY_URL != ''
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_URL }}
        run: curl --fail --silent --show-error --max-time 10 --retry 3 --retry-all-errors "$GATEWAY_URL/health"

      # A real agent journey: register, create a project, schedule deliveries to the receiver,
      # verify signatures, retries, cancel. Once GATEWAY_URL is set this is required: missing
      # RECEIVER_URL or RECEIVER_TOKEN fails it, and a failure stops production.
      - name: Staging journey
        if: inputs.environment == 'staging' && vars.GATEWAY_URL != ''
        timeout-minutes: 10
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          RECEIVER_URL: ${{ vars.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: node apps/gateway/e2e/staging.mjs
