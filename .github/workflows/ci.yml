name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p runlater-api -- -D warnings

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  workers:
    # Bundles every Worker exactly as `wrangler deploy` would, without deploying.
    needs: [rust, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: cargo install worker-build --version 0.8.7 --locked
      - run: npm ci
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: apps/api
      # Drives the built API in local workerd: Durable Object SQLite, alarms, Queues.
      - run: npm run test:e2e
        working-directory: apps/api
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: apps/gateway
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: apps/receiver
      # Gateway + API + receiver together, driven by the real Agent Auth SDK, the MCP bridge,
      # and the same journey staging runs after each deploy.
      - run: npm run test:e2e
        working-directory: apps/gateway
      - run: npm run check -w @runlater/web
