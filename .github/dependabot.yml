# Weekly update PRs. Each still goes through CI, review and the production gate like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Its version is the Rust toolchain, kept in step with rust-toolchain.toml by hand. It
      # also has branches for Rust releases that don't exist yet, which Dependabot picks up.
      - dependency-name: dtolnay/rust-toolchain
